<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- FUENTE -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <!-- BOOTSTRP (solo para el navbar) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Estilos Propios (siempre despues de bootstrap) -->
    <link rel="stylesheet" href="../css/styles.css" />

    <title>Alclym Labs</title>
  </head>
  <body>
    <!-- HEADER -->
    <header class="header">
      <nav class="navbar navbar-expand-lg header__nav" data-bs-theme="dark">
        <div class="container-fluid header__container">
          <a class="navbar-brand header__logo" href="#">
            <img
              class="header__logo-icon"
              src="../img/logo 1.jpeg"
              alt="Logo Alclym Labs"
            />
          </a>

          <button
            class="navbar-toggler header__toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menuPrincipal"
            aria-controls="menuPrincipal"
            aria-expanded="false"
            aria-label="Abrir menú"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav ms-auto header__menu">
              <li class="nav-item">
                <a class="nav-link header__link" href="../index.html">Inicio</a>
              </li>
              <li class="nav-item">
                <a class="nav-link header__link" href="./contenido.html"
                  >Servicios</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link header__link" href="#">Contacto</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <!-- HERO -->
    <section class="contacto hero">
      <h2 class="texto wrapper">Conctacto</h2>
      <form class="formulario">
        <label for="Nombre" class="form-label mb-2 texto">Nombre</label>
        <input
          type="text"
          class="form-control"
          id="name"
          placeholder="Tu nombre"
          requerid
          name="name"
          value
        />
        <label for="email" class="form-label mb-2 texto">Correo</label>
        <input
          type="email"
          class="form-control"
          id="email"
          placeholder="tucorreo@ejemplo.com"
          required
          name="email"
          value
        />
        <label for="message" class="form-label texto">Mensaje</label>
        <textarea
          class="form-control"
          id="Message"
          placeholder="Escribe tu mensaje..."
          rows="5"
          required
        ></textarea>
        <a class="texto boton-hero btn-outline" target="_blank" href="#"
          >Enviar</a
        >
      </form>
    </section>

    <!-- FOOTER -->
    <footer class="footer">
      <section>
        <div class="footer__redes">
          <div>
            <a
              class="btn btn-primary boton-instagram"
              role="button"
              href="https://www.instagram.com/lukatallone_"
              target="_blank"
              >Instagram</a
            >
          </div>
          <div>
            <a
              class="btn btn-primary boton-whatsapp"
              role="button"
              href="https://wa.me/5493513250628"
              target="_blank"
              >Whatsapp</a
            >
          </div>
          <div>
            <a
              class="btn btn-primary boton-gmail"
              role="button"
              href="mailto:lukatallone9@gmail.com"
              target="_blank"
              >Gmail</a
            >
          </div>
        </div>
      </section>
    </footer>
  </body>
</html>
