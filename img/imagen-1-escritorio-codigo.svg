  <rect x="320" y="274" width="240" height="22" rx="11" fill="#ffffff" opacity="0.85"/>
  <rect x="320" y="316" width="360" height="10" rx="5" fill="#ffffff" opacity="0.6"/>
  <rect x="320" y="334" width="300" height="10" rx="5" fill="#ffffff" opacity="0.6"/>
  <rect x="320" y="354" width="110" height="20" rx="10" fill="#fbbf24"/>
  <text x="780" y="330" font-family="Consolas, monospace" font-size="120" font-weight="700" fill="#ffffff" opacity="0.25" text-anchor="middle">&lt;/&gt;</text>
  <!-- tarjetas -->
  <rect x="310" y="404" width="170" height="120" rx="12" fill="#eef2ff"/>
  <rect x="515" y="404" width="170" height="120" rx="12" fill="#eef2ff"/>
  <rect x="720" y="404" width="170" height="120" rx="12" fill="#eef2ff"/>
  <circle cx="345" cy="436" r="14" fill="#6366f1"/>
  <circle cx="550" cy="436" r="14" fill="#8b5cf6"/>
  <circle cx="755" cy="436" r="14" fill="#06b6d4"/>
  <rect x="328" y="466" width="110" height="9" rx="4" fill="#a5b4fc"/>
  <rect x="533" y="466" width="110" height="9" rx="4" fill="#c4b5fd"/>
  <rect x="738" y="466" width="110" height="9" rx="4" fill="#67e8f9"/>
  <rect x="328" y="486" width="80" height="9" rx="4" fill="#c7d2fe"/>
  <rect x="533" y="486" width="80" height="9" rx="4" fill="#ddd6fe"/>
  <rect x="738" y="486" width="80" height="9" rx="4" fill="#a5f3fc"/>

  <!-- base de la laptop -->
  <path d="M200 570 H1000 L1040 610 Q1042 626 1024 626 H176 Q158 626 160 610 Z" fill="#cbd5e1"/>
  <rect x="520" y="570" width="160" height="12" rx="6" fill="#94a3b8"/>

