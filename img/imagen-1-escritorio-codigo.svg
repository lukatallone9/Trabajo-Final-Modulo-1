    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="1050" cy="130" r="90" fill="#ffffff" opacity="0.5"/>
  <circle cx="140" cy="640" r="120" fill="#ffffff" opacity="0.35"/>

  <!-- Laptop -->
  <rect x="250" y="130" width="700" height="440" rx="22" fill="#1f2937"/>
  <rect x="274" y="154" width="652" height="392" rx="10" fill="#ffffff"/>
  <!-- barra del navegador -->
  <rect x="274" y="154" width="652" height="40" rx="10" fill="#eef2f7"/>
  <circle cx="300" cy="174" r="7" fill="#f87171"/>
